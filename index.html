<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Belajar Bahasa Inggris</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #2d3436;
            margin-top: 0;
            font-size: 24px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: #636e72;
        }
        .word-box {
            background-color: #dfe6e9;
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 10px;
            color: #2d3436;
            margin-bottom: 20px;
        }
        .hint {
            font-style: italic;
            color: #b2bec3;
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #b2bec3;
            border-radius: 8px;
            outline: none;
            text-align: center;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #6c5ce7;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #6c5ce7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background-color: #5b4bc4;
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
            min-height: 27px;
        }
        .correct { color: #2ecc71; }
        .wrong { color: #e74c3c; }
    </style>
</head>
<body>

<div class="game-container" id="gameBox">
    <h1>📝 Tebak Kata Inggris</h1>
    
    <div class="stats">
        <div>Soal: <span id="questionNum">1</span>/5</div>
        <div>Skor: <span id="score">0</span></div>
    </div>

    <!-- Kata yang diacak kemunculannya -->
    <div class="word-box" id="scrambledWord">_____</div>
    <div class="hint" id="hintText">Petunjuk: Arti kata</div>

    <input type="text" id="userInput" placeholder="Ketik jawabanmu di sini..." autocomplete="off">
    <button onclick="checkAnswer()" id="submitBtn">Kirim Jawaban</button>
    
    <div class="feedback" id="feedback"></div>
</div>

<script>
    // Bank data soal (bisa kamu tambah atau ubah sendiri)
    const quizData = [
        { jawaban: "APPLE", acak: "P P L A E", arti: "Buah berwarna merah atau hijau" },
        { jawaban: "BOOK", acak: "O O B K", arti: "Sesuatu yang kamu baca" },
        { jawaban: "SCHOOL", acak: "O H C S L O", arti: "Tempat untuk belajar" },
        { jawaban: "CHAIR", acak: "I A C H R", arti: "Sesuatu yang digunakan untuk duduk" },
        { jawaban: "WATER", acak: "E T A R W", arti: "Benda cair yang kamu minum setiap hari" }
    ];

    let currentQuestion = 0;
    let score = 0;

    // Elemen HTML
    const scrambledWordEl = document.getElementById("scrambledWord");
    const hintTextEl = document.getElementById("hintText");
    const userInputEl = document.getElementById("userInput");
    const feedbackEl = document.getElementById("feedback");
    const scoreEl = document.getElementById("score");
    const questionNumEl = document.getElementById("questionNum");
    const submitBtn = document.getElementById("submitBtn");

    // Fungsi memulai / memuat soal
    function loadQuiz() {
        if (currentQuestion < quizData.length) {
            // Reset input dan feedback
            userInputEl.value = "";
            feedbackEl.innerText = "";
            userInputEl.disabled = false;
            submitBtn.disabled = false;
            submitBtn.innerText = "Kirim Jawaban";

            // Tampilkan soal baru
            questionNumEl.innerText = currentQuestion + 1;
            scrambledWordEl.innerText = quizData[currentQuestion].acak;
            hintTextEl.innerText = "Petunjuk: " + quizData[currentQuestion].arti;
        } else {
            // Jika semua soal sudah selesai
            showFinalResult();
        }
    }

    // Fungsi memeriksa jawaban user
    function checkAnswer() {
        const userAnswer = userInputEl.value.trim().toUpperCase();
        const correctAnswer = quizData[currentQuestion].jawaban;

        if (userAnswer === "") {
            feedbackEl.innerText = "Isi jawabanmu dulu ya!";
            feedbackEl.className = "feedback wrong";
            return;
        }

        if (userAnswer === correctAnswer) {
            feedbackEl.innerText = "✅ Hebat! Jawabanmu Benar!";
            feedbackEl.className = "feedback correct";
            score += 20; // Setiap soal benar bernilai 20 poin
            scoreEl.innerText = score;
        } else {
            feedbackEl.innerText = `❌ Salah! Yang benar adalah: ${correctAnswer}`;
            feedbackEl.className = "feedback wrong";
        }

        // Kunci input sementara agar user bisa membaca feedback
        userInputEl.disabled = true;
        submitBtn.innerText = "Lanjut";
        submitBtn.onclick = nextQuestion;
    }

    // Fungsi beralih ke soal berikutnya
    function nextQuestion() {
        currentQuestion++;
        submitBtn.onclick = checkAnswer; // Kembalikan fungsi tombol ke periksa jawaban
        loadQuiz();
    }

    // Fungsi menampilkan layar akhir
    function showFinalResult() {
        let ucapan = "";
        if (score === 100) {
            ucapan = "Sempurna! Kamu luar biasa! 🌟";
        } else if (score >= 60) {
            ucapan = "Bagus sekali! Tingkatkan lagi! 👍";
        } else {
            ucapan = "Jangan menyerah, ayo belajar lagi! 💪";
        }

        document.getElementById("gameBox").innerHTML = `
            <h1>🎉 GAME SELESAI 🎉</h1>
            <div style="font-size: 22px; margin: 20px 0; color: #2d3436;">
                Skor Akhir Kamu:<br>
                <strong style="font-size: 48px; color: #6c5ce7;">${score}</strong>
            </div>
            <p style="font-weight: bold; color: #636e72;">${ucapan}</p>
            <button onclick="window.location.reload()">Main Lagi</button>
        `;
    }

    // Jalankan game pertama kali saat web dibuka
    loadQuiz();
</script>

</body>
</html>
