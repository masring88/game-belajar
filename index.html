<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Belajar Bahasa Inggris</title>
    <!-- Menghubungkan ke file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container" id="gameBox">
    <h1>📝 Tebak Kata Inggris</h1>
    
    <div class="stats">
        <div>Soal: <span id="questionNum">1</span>/5</div>
        <div>Skor: <span id="score">0</span></div>
    </div>

    <div class="word-box" id="scrambledWord">_____</div>
    <div class="hint" id="hintText">Petunjuk: Arti kata</div>

    <input type="text" id="userInput" placeholder="Ketik jawabanmu di sini..." autocomplete="off">
    <button onclick="checkAnswer()" id="submitBtn">Kirim Jawaban</button>
    
    <div class="feedback" id="feedback"></div>
</div>

<!-- Menghubungkan ke file JavaScript -->
<script src="script.js"></script>
</body>
</html>
